<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">Web Systems <span class="brand-dim">&middot; Kimai</span></span>
    <button id="settings" class="icon-btn" data-i18n-title="settings" type="button" aria-label="settings">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.9 4c0-.5 0-1-.1-1.4l2-1.6-2-3.4-2.4 1a7.6 7.6 0 00-2.4-1.4L15.6 2H8.4L8 5.2c-.9.3-1.7.8-2.4 1.4l-2.4-1-2 3.4 2 1.6a8.6 8.6 0 000 2.8l-2 1.6 2 3.4 2.4-1c.7.6 1.5 1.1 2.4 1.4l.4 3.2h7.2l.4-3.2c.9-.3 1.7-.8 2.4-1.4l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.4z"/>
      </svg>
    </button>
  </header>

  <section id="unconfigured" hidden>
    <p class="lead" data-i18n="notConfigured"></p>
    <button id="goSettings" class="wide primary" data-i18n="openSettings" type="button"></button>
  </section>

  <!-- Toggl-style tracker bar: the description leads, the button sits beside it. -->
  <section id="tracker" hidden>
    <div class="bar">
      <textarea id="description" rows="1" data-i18n-placeholder="descriptionPlaceholder"></textarea>
      <div class="bar-right">
        <span id="clock" class="clock" hidden>0:00:00</span>
        <button id="toggle" class="round start" type="button" aria-label="start">
          <svg class="icon-start" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M8 5v14l11-7z"/>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect fill="currentColor" x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="meta">
      <span id="dot" class="dot" hidden></span>
      <select id="project" class="inline"></select>
      <select id="activity" class="inline"></select>
      <button id="billable" class="flag on" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path fill="currentColor" d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
          <path class="slash" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4.5 20 20 4.5"/>
        </svg>
        <span id="billableLabel"></span>
      </button>
    </div>

    <p id="error" class="error" hidden></p>
  </section>

  <section id="recentPanel" hidden>
    <h2 data-i18n="recent"></h2>
    <ul id="recent"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
