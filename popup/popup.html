<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hdr">
    <span class="brand">WS Tracker <span class="dim">&middot; Kimai</span></span>
    <span class="spacer"></span>
    <span id="today" class="today" hidden></span>
    <button id="settings" class="icon-btn" data-i18n-title="settings" data-i18n-label="settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.4.64.73.83H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <section id="unconfigured" class="unconfigured" hidden>
    <p data-i18n="notConfigured"></p>
    <button id="goSettings" class="btn-primary" data-i18n="openSettings" type="button"></button>
  </section>

  <section id="tracker" class="tracker" hidden>
    <div class="row-main">
      <textarea id="description" rows="1" data-i18n-placeholder="descriptionPlaceholder" data-i18n-label="descriptionLabel"></textarea>
      <div class="main-right">
        <span id="clock" class="clock" hidden>0:00:00</span>
        <button id="toggle" class="toggle start" type="button" data-i18n-label="start">
          <svg class="icon-start" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
          </svg>
        </button>
      </div>
    </div>

    <div class="row-project">
      <span id="dot" class="dot"></span>
      <select id="project" data-i18n-label="projectLabel"></select>
    </div>

    <div class="row-second">
      <select id="activity" data-i18n-label="activityLabel"></select>
      <button id="billable" class="billable" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 2v20"></path>
          <path d="M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 3 5 3.5 5 1.6 5 3.5-2.2 3-5 3-5-1.1-5-3"></path>
          <path class="slash" d="M3 21 21 3"></path>
        </svg>
        <span id="billableLabel" class="sr-only"></span>
      </button>
    </div>

    <div id="times" class="times" hidden>
      <label>
        <span data-i18n="fromLabel"></span>
        <input id="beginTime" type="time" step="60">
      </label>
      <label>
        <span data-i18n="toLabel"></span>
        <input id="endTime" type="time" step="60">
      </label>
      <span class="hint" data-i18n="endHint"></span>
    </div>
  </section>

  <div id="error" class="msg error" hidden></div>
  <div id="saved" class="msg saved" hidden></div>

  <section id="recentPanel" class="recentPanel" hidden>
    <div class="recent-head"><span data-i18n="recent"></span></div>
    <div id="recent" class="recent"></div>
    <div id="recentEmpty" class="recent-empty" data-i18n="recentEmpty" hidden></div>
    <!-- The popup only ever holds the tail of the list, so it says where the rest is. -->
    <a id="allEntries" class="all-entries" target="_blank" rel="noopener" hidden>
      <span data-i18n="allEntries"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 4h6v6"></path>
        <path d="M20 4 10 14"></path>
        <path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path>
      </svg>
    </a>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
